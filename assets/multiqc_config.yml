# ============================================================
#  assets/multiqc_config.yml
#  MultiQC configuration for ReapTEC-B pipeline
# ============================================================

title: "ReapTEC-B Pipeline QC Report"
subtitle: "B Cell 5' scRNA-seq — Bidirectional Enhancer Analysis"
intro_text: "Quality control summary for ReapTEC-B pipeline run"

report_comment: >
    This report was generated by the ReapTEC-B Nextflow pipeline.
    Based on Oguchi et al., Science 2024 (doi:10.1126/science.add8394).

# Order of modules in report
module_order:
    - fastqc:
        name: "FastQC (raw)"
        path_filters:
            - "*_fastqc.zip"
    - cutadapt:
        name: "Trim Galore"
    - star:
        name: "STAR Alignment"

# Table columns to show prominently
table_columns_visible:
    FastQC:
        percent_duplicates: True
        percent_gc: True
        avg_sequence_length: True
        percent_fails: False
        total_sequences: True
    STAR:
        uniquely_mapped_percent: True
        multimapped_percent: True
        unmapped_tooshort_percent: True

# Custom colour scheme
custom_plot_config:
    fastqc_sequence_quality_plot:
        ylab: "Phred Quality Score"

# Ignore certain file patterns
fn_ignore_paths:
    - "*/work/*"
    - "*/.nextflow/*"
